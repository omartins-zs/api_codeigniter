services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CI_ENV: production
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ci_network

  nginx:
    image: nginx:1.27-alpine
    container_name: ci_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ci_network

  mysql:
    image: mysql:8.0
    container_name: ci_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-apiclasse}
      MYSQL_USER: ${DB_USERNAME:-api_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-api_secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_secret}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ci_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ci_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ci_network

volumes:
  mysql_data:
    driver: local

networks:
  ci_network:
    driver: bridge
